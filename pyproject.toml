[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "thingiverse-publisher"
dynamic = ["version"]
description = "A simple tool to publish things to Thingiverse using the Thingiverse API"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "nomike", email = "nomike@nomike.com" }]
keywords = ["thingiverse", "api", "3d", "publish", "maker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "thingiverse-client==1.1.1",
    "docopt==0.6.2",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.7.0",
    "ruff==0.17.6",
    "pytest==9.2.0",
]

[project.scripts]
thingiverse-publisher = "thingiverse_publisher.cli:main"

[tool.hatch.version]
source = "code"
path = "thingiverse_publisher/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["thingiverse_publisher"]

[tool.hatch.build.targets.sdist]
include = ["thingiverse_publisher"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["thingiverse_publisher", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
